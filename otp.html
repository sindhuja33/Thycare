<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify OTP — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

  <div class="min-h-screen flex">
    <div class="hidden lg:flex lg:w-1/2 brand-gradient relative overflow-hidden items-center justify-center p-12">
      <div class="absolute -top-24 -left-24 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-32 -right-16 w-96 h-96 bg-white/10 rounded-full blur-3xl"></div>
      <div class="relative z-10 max-w-md animate-fade-in-up">
        <div class="w-16 h-16 rounded-2xl bg-white/95 flex items-center justify-center shadow-xl mb-8">
          <i data-lucide="shield-check" class="w-9 h-9 text-blue-600"></i>
        </div>
        <h1 class="text-white font-extrabold text-4xl leading-tight">Almost there. Let's verify it's you.</h1>
        <p class="text-white/85 mt-4 text-base leading-relaxed">We've sent a 4-digit verification code to keep your family's care account secure.</p>
      </div>
    </div>

    <div class="flex-1 flex items-center justify-center px-6 py-10">
      <div class="w-full max-w-sm animate-fade-in-up">
        <a href="login.html" class="inline-flex items-center gap-1.5 text-slate-500 text-sm font-medium mb-6 hover:text-slate-800">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
        </a>

        <div class="w-14 h-14 rounded-2xl brand-gradient flex items-center justify-center shadow-lg mb-5">
          <i data-lucide="message-square-lock" class="w-7 h-7 text-white"></i>
        </div>

        <h2 class="text-2xl font-extrabold text-slate-900">Enter verification code</h2>
        <p class="text-slate-500 text-sm mt-1.5">Sent to <span id="phone-display" class="font-semibold text-slate-700">+91 98765 43210</span></p>

        <div class="mt-8">
          <div class="flex gap-3 justify-between" id="otp-boxes">
            <input class="otp-box input-field w-full text-center text-2xl font-bold" maxlength="1" inputmode="numeric" />
            <input class="otp-box input-field w-full text-center text-2xl font-bold" maxlength="1" inputmode="numeric" />
            <input class="otp-box input-field w-full text-center text-2xl font-bold" maxlength="1" inputmode="numeric" />
            <input class="otp-box input-field w-full text-center text-2xl font-bold" maxlength="1" inputmode="numeric" />
          </div>
          <p id="otp-error" class="text-xs text-red-500 mt-3 hidden flex items-center gap-1">
            <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Incorrect OTP. Please try again.
          </p>

          <div class="flex items-center justify-between mt-6">
            <p class="text-sm text-slate-500">
              Didn't receive code?
              <button id="resend-btn" onclick="resendOtp()" class="text-blue-600 font-semibold disabled:text-slate-400" disabled>Resend in <span id="resend-timer">30</span>s</button>
            </p>
          </div>

          <button id="verify-btn" onclick="verifyOtp()" class="btn-primary w-full py-3.5 mt-6 flex items-center justify-center gap-2 press-scale">
            <span id="verify-label">Verify & Continue</span>
          </button>

          <p class="text-center text-xs text-slate-400 mt-4">Demo tip: any 4 digits work, except <span class="font-semibold">0000</span></p>
        </div>
      </div>
    </div>
  </div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.redirectIfAuthed();

  const phone = sessionStorage.getItem("cc_pending_phone") || "9876543210";
  document.getElementById("phone-display").textContent =
    "+91 " + phone.slice(0, 5) + " " + phone.slice(5);

  const boxes = Array.from(document.querySelectorAll(".otp-box"));
  boxes[0].focus();
  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      box.value = box.value.replace(/\D/g, "").slice(0, 1);
      document.getElementById("otp-error").classList.add("hidden");
      boxes.forEach(b => b.classList.remove("!border-red-400"));
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      if (boxes.every(b => b.value)) verifyOtp();
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
    });
  });

  let timeLeft = 30;
  const timerEl = document.getElementById("resend-timer");
  const resendBtn = document.getElementById("resend-btn");
  const countdown = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(countdown);
      resendBtn.disabled = false;
      resendBtn.innerHTML = "Resend OTP";
    }
  }, 1000);

  function resendOtp() {
    if (resendBtn.disabled) return;
    UI.toast("OTP resent successfully", "success");
    resendBtn.disabled = true;
    timeLeft = 30;
    timerEl.textContent = timeLeft;
    resendBtn.innerHTML = `Resend in <span id="resend-timer">30</span>s`;
    boxes.forEach(b => (b.value = ""));
    boxes[0].focus();
    const t2 = setInterval(() => {
      timeLeft--;
      const el = document.getElementById("resend-timer");
      if (el) el.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(t2);
        resendBtn.disabled = false;
        resendBtn.innerHTML = "Resend OTP";
      }
    }, 1000);
  }

  function verifyOtp() {
    const code = boxes.map(b => b.value).join("");
    const errorEl = document.getElementById("otp-error");
    if (code.length !== 4) return;

    const btn = document.getElementById("verify-btn");
    const label = document.getElementById("verify-label");
    btn.disabled = true;
    label.innerHTML = `<span class="spinner w-4 h-4"></span> Verifying…`;

    const isValid = code !== "0000";

    UI.simulateApi({ success: isValid, delay: 1100 }).then(() => {
      Store.init();
      Store.setAuthed(true);
      UI.toast("Login successful", "success");
      setTimeout(() => (window.location.href = "home.html"), 500);
    }).catch(() => {
      btn.disabled = false;
      label.textContent = "Verify & Continue";
      errorEl.classList.remove("hidden");
      boxes.forEach(b => { b.classList.add("!border-red-400"); b.value = ""; });
      boxes[0].focus();
      UI.icons();
    });
  }

  lucide.createIcons();
</script>
</body>
</html>
