<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/design-system.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body class="bg-[var(--canvas)]">

<div class="app-frame hero-gradient relative overflow-hidden flex flex-col items-center justify-center">
  <div class="mesh-blob w-72 h-72 bg-white/20 -top-16 -left-16"></div>
  <div class="mesh-blob w-96 h-96 bg-emerald-300/20 -bottom-24 -right-20"></div>
  <div class="mesh-blob w-56 h-56 bg-blue-300/25 top-1/3 -right-24"></div>

  <div class="relative z-10 flex flex-col items-center px-8">
    <div class="w-[104px] h-[104px] rounded-[32px] bg-white/95 flex items-center justify-center shadow-2xl anim-float">
      <i data-lucide="heart-pulse" class="w-12 h-12 text-blue-600" stroke-width="2.2"></i>
    </div>
    <h1 class="text-white font-extrabold text-[32px] mt-7 tracking-tight anim-fade-up stagger-2">CareConnect</h1>
    <p class="text-white/80 text-[15px] mt-2 font-medium tracking-tight anim-fade-up stagger-3">Compassionate care, at your doorstep</p>
  </div>

  <div class="absolute bottom-[calc(64px+var(--safe-bottom))] flex flex-col items-center gap-4 anim-fade-up stagger-4">
    <span class="spinner w-6 h-6"></span>
    <p class="text-white/60 text-[12.5px] font-semibold tracking-wide" id="splash-status">Setting things up…</p>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  Store.init();
  lucide.createIcons();
  setTimeout(() => document.getElementById("splash-status").textContent = "Almost ready…", 900);
  setTimeout(() => {
    window.location.href = Store.isAuthed() ? "home.html" : "login.html";
  }, 1700);
</script>
</body>
</html>
