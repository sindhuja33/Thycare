<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Settings — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/design-system.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body class="bg-[var(--canvas)]">

<div class="app-frame">
  <header class="app-topbar px-5 pb-4 flex items-center gap-3">
    <a href="profile.html" class="nav-btn"><i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i></a>
    <h1 class="font-extrabold text-[17px] text-[var(--ink-900)] tracking-tight">Settings</h1>
  </header>

  <main class="scroll-content px-5 pt-2 space-y-5">

    <div class="card p-1.5 anim-fade-up">
      <div class="flex items-center justify-between p-3.5">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="moon" class="w-4 h-4 text-[var(--ink-500)]"></i>Dark Mode</span>
        <div id="dark-toggle" class="toggle" onclick="onToggleDark()"><div class="toggle-dot"></div></div>
      </div>
      <div class="divider mx-3.5"></div>
      <div class="flex items-center justify-between p-3.5">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="bell" class="w-4 h-4 text-[var(--ink-500)]"></i>Push Notifications</span>
        <div id="notif-toggle" class="toggle on" onclick="toggleSwitch('notif-toggle')"><div class="toggle-dot"></div></div>
      </div>
      <div class="divider mx-3.5"></div>
      <div class="flex items-center justify-between p-3.5">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="mail" class="w-4 h-4 text-[var(--ink-500)]"></i>Email Alerts</span>
        <div id="email-toggle" class="toggle on" onclick="toggleSwitch('email-toggle')"><div class="toggle-dot"></div></div>
      </div>
    </div>

    <div class="card p-1.5 anim-fade-up stagger-1">
      <button onclick="openLanguageSheet()" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="languages" class="w-4 h-4 text-[var(--ink-500)]"></i>Language</span>
        <span class="flex items-center gap-1.5 text-[13px] text-[var(--ink-400)] font-semibold"><span id="lang-label">English</span><i data-lucide="chevron-right" class="w-4 h-4"></i></span>
      </button>
    </div>

    <div class="card p-1.5 anim-fade-up stagger-2">
      <a href="#" onclick="UI.toast('Privacy Policy opened','info');return false;" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="shield" class="w-4 h-4 text-[var(--ink-500)]"></i>Privacy Policy</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </a>
      <div class="divider mx-3.5"></div>
      <a href="#" onclick="UI.toast('Terms of Service opened','info');return false;" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="file-text" class="w-4 h-4 text-[var(--ink-500)]"></i>Terms of Service</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </a>
      <div class="divider mx-3.5"></div>
      <a href="faq.html" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="help-circle" class="w-4 h-4 text-[var(--ink-500)]"></i>FAQ</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </a>
    </div>

    <button onclick="UI.logout()" class="btn w-full !border-2 !border-[var(--red-50)] bg-transparent text-[var(--red-500)] anim-fade-up stagger-3">
      <i data-lucide="log-out" class="w-4 h-4"></i> Logout
    </button>

    <p class="text-center text-[11px] text-[var(--ink-400)] font-semibold pb-2">CareConnect v1.0.0 (Prototype)</p>
  </main>
</div>

<nav id="floating-nav"></nav>

<!-- Language Sheet -->
<div id="lang-sheet-backdrop" class="sheet-backdrop" onclick="UI.closeSheet('lang-sheet')"></div>
<div id="lang-sheet" class="sheet px-6" onclick="event.stopPropagation()">
  <div class="sheet-handle"></div>
  <h3 class="font-extrabold text-[19px] text-[var(--ink-900)] tracking-tight mt-3 mb-3">Select Language</h3>
  <div id="lang-list" class="space-y-1 pb-2"></div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("settings");

  const darkToggle = document.getElementById("dark-toggle");
  darkToggle.classList.toggle("on", Store.getDarkMode());
  function onToggleDark() {
    const on = UI.toggleDarkMode();
    darkToggle.classList.toggle("on", on);
    UI.toast(on ? "Dark mode enabled" : "Dark mode disabled", "info");
  }
  function toggleSwitch(id) { document.getElementById(id).classList.toggle("on"); }

  const languages = ["English", "Tamil", "Hindi", "Telugu", "Malayalam"];
  let currentLang = "English";
  function openLanguageSheet() {
    document.getElementById("lang-list").innerHTML = languages.map(l => `
      <button onclick="selectLanguage('${l}')" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)] text-left">
        <span class="text-[14px] font-bold text-[var(--ink-700)]">${l}</span>
        ${l === currentLang ? `<i data-lucide="check" class="w-4 h-4 text-[var(--blue-600)]"></i>` : ""}
      </button>`).join("");
    UI.icons();
    UI.openSheet("lang-sheet");
  }
  function selectLanguage(l) {
    currentLang = l;
    document.getElementById("lang-label").textContent = l;
    UI.closeSheet("lang-sheet");
    UI.toast(`Language set to ${l}`, "success");
  }
  UI.icons();
</script>
</body>
</html>
