<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FAQ — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/design-system.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body class="bg-[var(--canvas)]">

<div class="app-frame">
  <header class="app-topbar px-5 pb-4 flex items-center gap-3">
    <a href="home.html" class="nav-btn"><i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i></a>
    <h1 class="font-extrabold text-[17px] text-[var(--ink-900)] tracking-tight">FAQ</h1>
  </header>

  <main class="scroll-content px-5 pt-2">
    <div id="faq-list" class="space-y-2.5"></div>

    <a href="support.html" class="card p-4 flex items-center justify-between mt-6 lift press bg-gradient-to-br from-[var(--blue-50)] to-[var(--green-50)] !border-blue-100 anim-fade-up">
      <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="message-circle-question" class="w-4 h-4 text-[var(--blue-600)]"></i>Still have questions? Contact support</span>
      <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
    </a>
  </main>
</div>

<nav id="floating-nav"></nav>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("support");

  document.getElementById("faq-list").innerHTML = MOCK.faqs.map((f, i) => `
    <div class="card overflow-hidden anim-fade-up stagger-${(i%6)+1}">
      <button onclick="toggleFaq(${i})" class="w-full flex items-center justify-between p-4 text-left">
        <span class="text-[13.5px] font-bold text-[var(--ink-800)] pr-3">${f.q}</span>
        <i data-lucide="chevron-down" id="faq-icon-${i}" class="w-4 h-4 text-[var(--ink-400)] shrink-0 transition-transform"></i>
      </button>
      <div id="faq-body-${i}" class="hidden px-4 pb-4">
        <p class="text-[12.5px] text-[var(--ink-500)] leading-relaxed font-medium">${f.a}</p>
      </div>
    </div>`).join("");
  UI.icons();

  function toggleFaq(i) {
    const body = document.getElementById("faq-body-" + i);
    const icon = document.getElementById("faq-icon-" + i);
    const isOpen = !body.classList.contains("hidden");
    body.classList.toggle("hidden");
    icon.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
  }
</script>
</body>
</html>
