<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Profile — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/design-system.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body class="bg-[var(--canvas)]">

<div class="app-frame">
  <header class="app-topbar px-5 pb-4 flex items-center gap-3">
    <a href="home.html" class="nav-btn"><i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i></a>
    <h1 class="font-extrabold text-[17px] text-[var(--ink-900)] tracking-tight">Profile</h1>
  </header>

  <main class="scroll-content px-5 pt-2">

    <div class="card p-6 text-center bg-gradient-to-br from-[var(--blue-50)] to-[var(--green-50)] !border-blue-100 anim-fade-up">
      <div class="relative inline-block">
        <img id="avatar" src="" class="w-[92px] h-[92px] rounded-full object-cover border-[3px] border-white shadow-lg mx-auto" />
        <button onclick="UI.toast('Photo upload simulated','success')" class="absolute bottom-0 right-0 w-8 h-8 rounded-full hero-gradient flex items-center justify-center border-2 border-white">
          <i data-lucide="camera" class="w-3.5 h-3.5 text-white"></i>
        </button>
      </div>
      <h2 class="font-extrabold text-[19px] text-[var(--ink-900)] mt-3 tracking-tight" id="name">—</h2>
      <p class="text-[13px] text-[var(--ink-500)] font-medium" id="email">—</p>
      <div class="flex items-center justify-center gap-2 mt-3">
        <span class="badge badge-blue"><i data-lucide="gem" class="w-3 h-3"></i> <span id="plan-badge">Premium</span></span>
        <span class="badge badge-green" id="kyc-badge"><i data-lucide="shield-check" class="w-3 h-3"></i> KYC Verified</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-5">
      <a href="patients.html" class="card p-4 lift press anim-fade-up stagger-1">
        <div class="w-10 h-10 rounded-2xl bg-[var(--blue-50)] flex items-center justify-center mb-2"><i data-lucide="users-round" class="w-5 h-5 text-[var(--blue-600)]"></i></div>
        <p class="text-[24px] font-extrabold text-[var(--ink-900)] tracking-tight" id="patients-count">0</p>
        <p class="text-[11.5px] text-[var(--ink-500)] font-semibold">Patients</p>
      </a>
      <a href="bookings.html" class="card p-4 lift press anim-fade-up stagger-2">
        <div class="w-10 h-10 rounded-2xl bg-[var(--green-50)] flex items-center justify-center mb-2"><i data-lucide="calendar-check" class="w-5 h-5 text-[var(--green-600)]"></i></div>
        <p class="text-[24px] font-extrabold text-[var(--ink-900)] tracking-tight" id="bookings-count">0</p>
        <p class="text-[11.5px] text-[var(--ink-500)] font-semibold">Bookings</p>
      </a>
    </div>

    <div class="card p-1.5 mt-5 anim-fade-up stagger-3">
      <button onclick="openEditProfile()" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="user-round-pen" class="w-4 h-4 text-[var(--ink-500)]"></i>Edit Profile</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </button>
      <a href="subscriptions.html" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="gem" class="w-4 h-4 text-[var(--ink-500)]"></i>Manage Subscription</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </a>
      <a href="settings.html" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="settings" class="w-4 h-4 text-[var(--ink-500)]"></i>Settings</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </a>
      <a href="support.html" class="w-full flex items-center justify-between p-3.5 rounded-2xl active:bg-[var(--ink-50)]">
        <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="life-buoy" class="w-4 h-4 text-[var(--ink-500)]"></i>Help & Support</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
      </a>
    </div>

    <button onclick="UI.logout()" class="btn w-full mt-5 mb-4 !border-2 !border-[var(--red-50)] bg-transparent text-[var(--red-500)] anim-fade-up stagger-4">
      <i data-lucide="log-out" class="w-4 h-4"></i> Logout
    </button>
  </main>
</div>

<nav id="floating-nav"></nav>

<!-- Edit Sheet -->
<div id="edit-sheet-backdrop" class="sheet-backdrop" onclick="UI.closeSheet('edit-sheet')"></div>
<div id="edit-sheet" class="sheet px-6" onclick="event.stopPropagation()">
  <div class="sheet-handle"></div>
  <h3 class="font-extrabold text-[19px] text-[var(--ink-900)] tracking-tight mt-3 mb-4">Edit Profile</h3>
  <div class="space-y-3.5">
    <div><label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Full Name</label><input id="ef-name" class="field" /></div>
    <div><label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Email</label><input id="ef-email" class="field" /></div>
    <div><label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Phone</label><input id="ef-phone" class="field" /></div>
    <div><label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Address</label><textarea id="ef-address" rows="2" class="field resize-none"></textarea></div>
  </div>
  <div class="flex gap-3 mt-6 mb-2">
    <button onclick="UI.closeSheet('edit-sheet')" class="btn btn-secondary flex-1">Cancel</button>
    <button onclick="saveProfile()" id="save-profile-btn" class="btn btn-primary flex-1">Save Changes</button>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("profile");

  function render() {
    const user = Store.getUser();
    document.getElementById("avatar").src = user.avatar;
    document.getElementById("name").textContent = user.name;
    document.getElementById("email").textContent = user.email;
    document.getElementById("plan-badge").textContent = MOCK.plans.find(p => p.id === Store.getPlan())?.name || "Basic";
    const kyc = document.getElementById("kyc-badge");
    kyc.innerHTML = user.kycVerified ? `<i data-lucide="shield-check" class="w-3 h-3"></i> KYC Verified` : `<i data-lucide="shield-alert" class="w-3 h-3"></i> KYC Pending`;
    kyc.className = "badge " + (user.kycVerified ? "badge-green" : "badge-amber");
    document.getElementById("patients-count").textContent = Store.getPatients().length;
    document.getElementById("bookings-count").textContent = Store.getBookings().length;
    UI.icons();
  }

  function openEditProfile() {
    const user = Store.getUser();
    document.getElementById("ef-name").value = user.name;
    document.getElementById("ef-email").value = user.email;
    document.getElementById("ef-phone").value = user.phone;
    document.getElementById("ef-address").value = user.address;
    UI.openSheet("edit-sheet");
  }

  function saveProfile() {
    const btn = document.getElementById("save-profile-btn");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner w-4 h-4"></span> Saving…`;
    UI.simulateApi({ success: true, delay: 800 }).then(() => {
      const user = Store.getUser();
      Store.setUser({
        ...user,
        name: document.getElementById("ef-name").value.trim() || user.name,
        email: document.getElementById("ef-email").value.trim() || user.email,
        phone: document.getElementById("ef-phone").value.trim() || user.phone,
        address: document.getElementById("ef-address").value.trim() || user.address
      });
      btn.disabled = false; btn.textContent = "Save Changes";
      UI.closeSheet("edit-sheet");
      UI.toast("Profile updated successfully", "success");
      render();
    });
  }
  render();
</script>
</body>
</html>
