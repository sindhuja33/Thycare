<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Support — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/design-system.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body class="bg-[var(--canvas)]">

<div class="app-frame">
  <header class="app-topbar px-5 pb-4 flex items-center gap-3">
    <a href="home.html" class="nav-btn"><i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i></a>
    <h1 class="font-extrabold text-[17px] text-[var(--ink-900)] tracking-tight">Support</h1>
  </header>

  <main class="scroll-content px-5 pt-2">

    <div class="grid grid-cols-2 gap-3.5 anim-fade-up">
      <button onclick="callSupport()" class="card p-5 text-center lift press">
        <div class="w-12 h-12 rounded-2xl bg-[var(--green-50)] flex items-center justify-center mx-auto mb-2.5"><i data-lucide="phone-call" class="w-6 h-6 text-[var(--green-600)]"></i></div>
        <p class="font-extrabold text-[var(--ink-900)] text-[13.5px] tracking-tight">Call Us</p>
        <p class="text-[11px] text-[var(--ink-500)] mt-0.5 font-medium">1800-123-4567</p>
      </button>
      <button onclick="emailSupport()" class="card p-5 text-center lift press">
        <div class="w-12 h-12 rounded-2xl bg-[var(--blue-50)] flex items-center justify-center mx-auto mb-2.5"><i data-lucide="mail" class="w-6 h-6 text-[var(--blue-600)]"></i></div>
        <p class="font-extrabold text-[var(--ink-900)] text-[13.5px] tracking-tight">Email Us</p>
        <p class="text-[11px] text-[var(--ink-500)] mt-0.5 font-medium">support@careconnect.in</p>
      </button>
    </div>

    <div class="card mt-5 flex flex-col h-[420px] overflow-hidden anim-fade-up stagger-1">
      <div class="px-4 py-3.5 border-b border-[var(--ink-100)] flex items-center gap-2.5 bg-gradient-to-r from-[var(--blue-50)] to-[var(--green-50)]">
        <div class="w-9 h-9 rounded-full hero-gradient flex items-center justify-center"><i data-lucide="headset" class="w-4 h-4 text-white"></i></div>
        <div>
          <p class="text-[13px] font-extrabold text-[var(--ink-800)]">CareConnect Support</p>
          <p class="text-[10.5px] text-[var(--green-600)] font-bold flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[var(--green-500)]"></span>Online</p>
        </div>
      </div>
      <div id="chat-body" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="p-3 border-t border-[var(--ink-100)] flex items-center gap-2">
        <input id="chat-input" class="field flex-1 !py-3" placeholder="Type your message…" onkeydown="if(event.key==='Enter') sendChat()" />
        <button onclick="sendChat()" class="w-11 h-11 rounded-2xl hero-gradient flex items-center justify-center shrink-0 press"><i data-lucide="send" class="w-4 h-4 text-white"></i></button>
      </div>
    </div>

    <a href="faq.html" class="card p-4 flex items-center justify-between mt-5 mb-2 lift press anim-fade-up stagger-2">
      <span class="flex items-center gap-3 text-[13.5px] font-bold text-[var(--ink-700)]"><i data-lucide="help-circle" class="w-4 h-4 text-[var(--ink-500)]"></i>Browse FAQs</span>
      <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--ink-400)]"></i>
    </a>
  </main>
</div>

<nav id="floating-nav"></nav>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("support");

  function callSupport() { UI.toast("Calling 1800-123-4567…", "info"); }
  function emailSupport() { UI.toast("Opening email to support@careconnect.in…", "info"); }

  const chatBody = document.getElementById("chat-body");
  const botReplies = [
    "Thanks for reaching out! Let me check that for you.",
    "I understand. Could you share your booking ID so I can look into it?",
    "You can track your caregiver's arrival from the Bookings page once assigned.",
    "I've noted your concern — our team will follow up within 24 hours.",
    "Is there anything else I can help you with today?"
  ];

  function addBubble(text, isUser) {
    const div = document.createElement("div");
    div.className = `flex ${isUser ? "justify-end" : "justify-start"} anim-fade-up`;
    div.innerHTML = `<div class="max-w-[75%] px-3.5 py-2.5 rounded-[18px] text-[13px] font-medium ${isUser ? "hero-gradient text-white rounded-br-md" : "bg-[var(--ink-100)] text-[var(--ink-700)] rounded-bl-md"}">${text}</div>`;
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
  }
  function addTyping() {
    const div = document.createElement("div");
    div.id = "typing-bubble";
    div.className = "flex justify-start";
    div.innerHTML = `<div class="bg-[var(--ink-100)] px-4 py-3 rounded-[18px] rounded-bl-md flex gap-1">
      <span class="w-1.5 h-1.5 bg-[var(--ink-400)] rounded-full anim-pulse"></span>
      <span class="w-1.5 h-1.5 bg-[var(--ink-400)] rounded-full anim-pulse" style="animation-delay:.15s"></span>
      <span class="w-1.5 h-1.5 bg-[var(--ink-400)] rounded-full anim-pulse" style="animation-delay:.3s"></span>
    </div>`;
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
  }
  function sendChat() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    addBubble(text, true);
    input.value = "";
    addTyping();
    setTimeout(() => {
      document.getElementById("typing-bubble")?.remove();
      addBubble(botReplies[Math.floor(Math.random() * botReplies.length)], false);
    }, 1300);
  }
  addBubble("Hi Sindhuja! 👋 I'm your CareConnect support assistant. How can I help you today?", false);
</script>
</body>
</html>
