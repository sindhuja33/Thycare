<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Patients — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/design-system.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body class="bg-[var(--canvas)]">

<div class="app-frame">
  <header class="app-topbar px-5 pb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="home.html" class="nav-btn"><i data-lucide="arrow-left" class="w-[18px] h-[18px]"></i></a>
      <h1 class="font-extrabold text-[17px] text-[var(--ink-900)] tracking-tight">Patients</h1>
    </div>
    <span class="badge badge-ink" id="count-badge">0 / 3</span>
  </header>

  <main class="scroll-content px-5 pt-2">
    <div id="patients-list" class="space-y-4"></div>

    <div id="empty-state" class="hidden card p-9 text-center anim-fade-up">
      <i data-lucide="users-round" class="w-11 h-11 text-[var(--ink-300)] mx-auto mb-3"></i>
      <p class="font-extrabold text-[var(--ink-800)] text-[15px]">No patients added yet</p>
      <p class="text-[13px] text-[var(--ink-500)] mt-1.5 font-medium leading-relaxed">Add a patient profile to start booking home care services.</p>
      <button onclick="openAddPatient()" class="btn btn-primary mt-5 !px-6 !min-h-[46px] mx-auto">Add Patient</button>
    </div>

    <div id="limit-banner" class="hidden mt-4 flex items-center gap-2.5 bg-[var(--amber-50)] text-[var(--amber-600)] text-[13px] font-semibold px-4 py-3.5 rounded-2xl">
      <i data-lucide="info" class="w-4 h-4 shrink-0"></i> You've reached the maximum of 3 patients.
    </div>
  </main>
</div>

<nav id="floating-nav"></nav>
<button onclick="openAddPatient()" id="mobile-fab" class="fab press"><i data-lucide="plus" class="w-6 h-6 text-white" stroke-width="2.5"></i></button>

<!-- Add/Edit Sheet -->
<div id="patient-sheet-backdrop" class="sheet-backdrop" onclick="UI.closeSheet('patient-sheet')"></div>
<div id="patient-sheet" class="sheet px-6" onclick="event.stopPropagation()">
  <div class="sheet-handle"></div>
  <div class="flex items-center justify-between mt-2 mb-5">
    <h3 class="font-extrabold text-[19px] text-[var(--ink-900)] tracking-tight" id="sheet-heading">Add Patient</h3>
    <button onclick="UI.closeSheet('patient-sheet')" class="nav-btn"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>
  <div class="space-y-4 pb-2">
    <div>
      <label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Full Name</label>
      <input id="pf-name" class="field" placeholder="e.g. Kamala Devi" />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Relationship</label>
        <select id="pf-relationship" class="field">
          <option>Mother</option><option>Father</option><option>Spouse</option>
          <option>Son</option><option>Daughter</option><option>Self</option><option>Other</option>
        </select>
      </div>
      <div>
        <label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Age</label>
        <input id="pf-age" class="field" placeholder="e.g. 65" />
      </div>
    </div>
    <div>
      <label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Gender</label>
      <select id="pf-gender" class="field">
        <option>Female</option><option>Male</option><option>Other</option>
      </select>
    </div>
    <div>
      <label class="text-[13px] font-bold text-[var(--ink-700)] mb-1.5 block">Medical Conditions</label>
      <input id="pf-conditions" class="field" placeholder="e.g. Diabetes, Hypertension" />
      <p class="text-[11.5px] text-[var(--ink-400)] mt-1.5 font-medium">Separate multiple conditions with commas</p>
    </div>
  </div>
  <div class="flex gap-3 mt-6">
    <button onclick="UI.closeSheet('patient-sheet')" class="btn btn-secondary flex-1">Cancel</button>
    <button onclick="savePatient()" id="save-patient-btn" class="btn btn-primary flex-1">Save Patient</button>
  </div>
</div>

<!-- Delete Sheet -->
<div id="delete-sheet-backdrop" class="sheet-backdrop" onclick="UI.closeSheet('delete-sheet')"></div>
<div id="delete-sheet" class="sheet px-6 text-center" onclick="event.stopPropagation()">
  <div class="sheet-handle"></div>
  <div class="w-14 h-14 rounded-2xl bg-[var(--red-50)] flex items-center justify-center mb-4 mx-auto mt-3">
    <i data-lucide="trash-2" class="w-7 h-7 text-[var(--red-500)]"></i>
  </div>
  <h3 class="font-extrabold text-[19px] text-[var(--ink-900)] tracking-tight">Remove Patient?</h3>
  <p class="text-[13.5px] text-[var(--ink-500)] mt-1.5 font-medium">This will permanently remove <span id="delete-name" class="font-bold text-[var(--ink-700)]">this patient</span> and their reports.</p>
  <div class="flex gap-3 mt-6 mb-2">
    <button onclick="UI.closeSheet('delete-sheet')" class="btn btn-secondary flex-1">Cancel</button>
    <button onclick="confirmDelete()" class="btn btn-danger flex-1">Remove</button>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("patients");

  const MAX_PATIENTS = 3;
  let editingId = null, deletingId = null;

  function conditionBadgeClass(c) { return c.toLowerCase() === "healthy" ? "badge-green" : "badge-blue"; }

  function render() {
    const patients = Store.getPatients();
    document.getElementById("count-badge").textContent = `${patients.length} / ${MAX_PATIENTS}`;

    const listEl = document.getElementById("patients-list");
    const emptyEl = document.getElementById("empty-state");

    if (patients.length === 0) {
      listEl.innerHTML = "";
      emptyEl.classList.remove("hidden");
    } else {
      emptyEl.classList.add("hidden");
      listEl.innerHTML = patients.map((p, i) => `
        <div class="card p-4 anim-fade-up stagger-${i+1}">
          <div class="flex items-start gap-3.5">
            <img src="${p.photo}" class="w-16 h-16 rounded-[20px] object-cover shrink-0" />
            <div class="min-w-0 flex-1">
              <p class="font-extrabold text-[var(--ink-900)] text-[15.5px] truncate tracking-tight">${p.name}</p>
              <p class="text-[12.5px] text-[var(--ink-500)] mt-0.5 font-medium">${p.relationship} • ${p.age} ${typeof p.age === "number" ? "years" : ""}</p>
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                ${p.conditions.map(c => `<span class="badge ${conditionBadgeClass(c)}">${c}</span>`).join("")}
              </div>
            </div>
          </div>
          <div class="divider my-3.5"></div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5 text-[12px] text-[var(--ink-500)] font-semibold">
              <i data-lucide="file-text" class="w-3.5 h-3.5"></i> ${p.reports.length} report${p.reports.length !== 1 ? "s" : ""}
            </div>
            <div class="flex items-center gap-1">
              <a href="patient-details.html?id=${p.id}" class="btn-sm text-[var(--blue-600)] font-bold px-3 py-1.5">View</a>
              <button onclick="openEditPatient('${p.id}')" class="btn-sm text-[var(--ink-600)] font-bold px-3 py-1.5">Edit</button>
              <button onclick="openDeleteSheet('${p.id}')" class="btn-sm text-[var(--red-500)] font-bold px-3 py-1.5">Delete</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    const atLimit = patients.length >= MAX_PATIENTS;
    document.getElementById("limit-banner").classList.toggle("hidden", !atLimit);
    const fab = document.getElementById("mobile-fab");
    fab.classList.toggle("opacity-40", atLimit);
    fab.classList.toggle("pointer-events-none", atLimit);
    UI.icons();
  }

  function openAddPatient() {
    if (Store.getPatients().length >= MAX_PATIENTS) { UI.toast("Maximum of 3 patients allowed", "error"); return; }
    editingId = null;
    document.getElementById("sheet-heading").textContent = "Add Patient";
    ["pf-name", "pf-age", "pf-conditions"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("pf-relationship").value = "Mother";
    document.getElementById("pf-gender").value = "Female";
    UI.openSheet("patient-sheet");
  }

  function openEditPatient(id) {
    const p = Store.getPatients().find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById("sheet-heading").textContent = "Edit Patient";
    document.getElementById("pf-name").value = p.name;
    document.getElementById("pf-relationship").value = p.relationship;
    document.getElementById("pf-age").value = p.age;
    document.getElementById("pf-gender").value = p.gender;
    document.getElementById("pf-conditions").value = p.conditions.join(", ");
    UI.openSheet("patient-sheet");
  }

  function savePatient() {
    const name = document.getElementById("pf-name").value.trim();
    const age = document.getElementById("pf-age").value.trim();
    if (!name || !age) { UI.toast("Please fill in name and age", "error"); return; }
    const conditions = document.getElementById("pf-conditions").value.split(",").map(c => c.trim()).filter(Boolean);

    const btn = document.getElementById("save-patient-btn");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner w-4 h-4"></span> Saving…`;

    UI.simulateApi({ success: true, delay: 700 }).then(() => {
      let patients = Store.getPatients();
      const data = {
        name, relationship: document.getElementById("pf-relationship").value,
        age: isNaN(age) ? age : Number(age),
        gender: document.getElementById("pf-gender").value,
        conditions: conditions.length ? conditions : ["Healthy"],
        photo: `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 60) + 1}`,
        reports: []
      };
      if (editingId) {
        patients = patients.map(p => p.id === editingId ? { ...p, ...data, photo: p.photo, reports: p.reports } : p);
      } else {
        patients.push({ id: "pat-" + Date.now(), ...data });
      }
      Store.setPatients(patients);
      btn.disabled = false; btn.textContent = "Save Patient";
      UI.closeSheet("patient-sheet");
      UI.toast(editingId ? "Patient updated" : "Patient added successfully", "success");
      render();
    });
  }

  function openDeleteSheet(id) {
    deletingId = id;
    const p = Store.getPatients().find(x => x.id === id);
    document.getElementById("delete-name").textContent = p ? p.name : "this patient";
    UI.openSheet("delete-sheet");
  }
  function confirmDelete() {
    Store.setPatients(Store.getPatients().filter(p => p.id !== deletingId));
    UI.closeSheet("delete-sheet");
    UI.toast("Patient removed", "success");
    render();
  }

  render();
</script>
</body>
</html>
