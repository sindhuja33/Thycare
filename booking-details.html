<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Booking Details — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div class="max-w-2xl mx-auto min-h-screen">
  <header class="sticky top-0 z-30 glass px-4 py-4 border-b border-slate-100 flex items-center gap-3">
    <a href="bookings.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center">
      <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
    </a>
    <h1 class="font-bold text-slate-900">Booking Details</h1>
  </header>

  <main id="content" class="px-4 py-6 pb-10"></main>
</div>

<!-- Cancel confirm modal -->
<div id="cancel-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center px-6">
  <div class="card p-6 max-w-sm w-full animate-scale-in text-center">
    <div class="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center mb-4 mx-auto">
      <i data-lucide="calendar-x" class="w-6 h-6 text-red-500"></i>
    </div>
    <h3 class="font-extrabold text-lg text-slate-900">Cancel Booking?</h3>
    <p class="text-sm text-slate-500 mt-1.5">Cancellation charges may apply if the visit is within 24 hours.</p>
    <div class="flex gap-3 mt-6">
      <button onclick="closeCancelModal()" class="btn-secondary flex-1 py-2.5">Keep Booking</button>
      <button onclick="confirmCancel()" class="flex-1 py-2.5 rounded-xl bg-red-500 text-white font-semibold press-scale">Cancel It</button>
    </div>
  </div>
</div>

<!-- Rating modal -->
<div id="rating-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center px-6">
  <div class="card p-6 max-w-sm w-full animate-scale-in text-center">
    <h3 class="font-extrabold text-lg text-slate-900">Rate Your Experience</h3>
    <p class="text-sm text-slate-500 mt-1.5">How was the service?</p>
    <div class="flex justify-center gap-2 mt-5" id="star-picker">
      ${""}
    </div>
    <textarea id="review-text" rows="3" class="input-field w-full resize-none mt-4" placeholder="Share your feedback (optional)"></textarea>
    <button onclick="submitRating()" class="btn-primary w-full py-2.5 mt-4">Submit Rating</button>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  let bookings = Store.getBookings();
  const booking = bookings.find(b => b.id === id);
  const content = document.getElementById("content");

  const iconMap = {
    "Patient Attender": "user-round", "Baby Sitter": "baby", "Elder Care": "heart-handshake",
    "Mother Care": "flower", "Post Surgery Care": "bandage", "Nursing Assistant": "stethoscope"
  };

  function render() {
    if (!booking) {
      content.innerHTML = `
        <div class="card p-10 text-center">
          <i data-lucide="file-x" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i>
          <p class="font-semibold text-slate-700">Booking not found</p>
          <a href="bookings.html" class="btn-primary px-5 py-2.5 text-sm mt-4 inline-block">Back to Bookings</a>
        </div>`;
      UI.icons();
      return;
    }

    const caregiver = MOCK.caregivers.find(c => c.name === booking.caregiver) || MOCK.caregivers[0];

    content.innerHTML = `
      <div class="card p-5 animate-fade-in-up">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center">
              <i data-lucide="${iconMap[booking.service] || "stethoscope"}" class="w-6 h-6 text-blue-600"></i>
            </div>
            <div>
              <p class="font-bold text-slate-900">${booking.service}</p>
              <p class="text-xs text-slate-400">${booking.id}</p>
            </div>
          </div>
          ${UI.statusBadge(booking.status)}
        </div>

        ${booking.status === "rejected" && booking.reason ? `
        <div class="mt-4 flex items-start gap-2 bg-red-50 text-red-600 text-xs font-medium px-3.5 py-3 rounded-xl">
          <i data-lucide="alert-triangle" class="w-4 h-4 mt-0.5 shrink-0"></i>
          <span>${booking.reason}</span>
        </div>` : ""}

        <div class="divider my-4"></div>
        <div class="space-y-3">
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="user" class="w-4 h-4"></i>Patient</span>
            <span class="font-semibold text-slate-800">${booking.patient}</span>
          </div>
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4"></i>Date & Time</span>
            <span class="font-semibold text-slate-800">${UI.formatDate(booking.date)}, ${booking.time}</span>
          </div>
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="timer" class="w-4 h-4"></i>Duration</span>
            <span class="font-semibold text-slate-800">${booking.duration}</span>
          </div>
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="map-pin" class="w-4 h-4"></i>Address</span>
            <span class="font-semibold text-slate-800 text-right max-w-[60%]">${booking.address}</span>
          </div>
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="indian-rupee" class="w-4 h-4"></i>Amount Paid</span>
            <span class="font-extrabold text-blue-600">${UI.formatCurrency(booking.amount)}</span>
          </div>
        </div>
      </div>

      ${booking.caregiver ? `
      <div class="card p-4 mt-4 animate-fade-in-up stagger-1">
        <p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-3">Caregiver</p>
        <div class="flex items-center gap-3.5">
          <img src="${caregiver.photo}" class="w-14 h-14 rounded-2xl object-cover" />
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5">
              <p class="font-bold text-slate-900 text-sm">${caregiver.name}</p>
              <i data-lucide="badge-check" class="w-3.5 h-3.5 text-blue-600"></i>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">${caregiver.experience} • ${caregiver.completedServices} services</p>
            <div class="flex items-center gap-1 mt-1">
              <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-500 text-amber-500"></i>
              <span class="text-xs font-semibold text-slate-700">${caregiver.rating}</span>
            </div>
          </div>
          ${booking.status === "upcoming" ? `
          <button onclick="UI.toast('Calling ${caregiver.name}…','info')" class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center shrink-0">
            <i data-lucide="phone" class="w-4 h-4 text-green-600"></i>
          </button>` : ""}
        </div>
      </div>` : ""}

      <div class="mt-5 space-y-2.5 animate-fade-in-up stagger-2">
        ${booking.status === "upcoming" ? `
          <button onclick="openCancelModal()" class="w-full py-3 rounded-xl border-2 border-red-200 text-red-500 font-semibold text-sm press-scale">Cancel Booking</button>
        ` : ""}
        ${booking.status === "completed" && !booking.rating ? `
          <button onclick="openRatingModal()" class="btn-primary w-full py-3 text-sm">Rate This Service</button>
        ` : ""}
        ${booking.status === "completed" && booking.rating ? `
          <div class="card p-4 flex items-center gap-2">
            <div class="flex gap-0.5">
              ${Array.from({length: 5}, (_, i) => `<i data-lucide="star" class="w-4 h-4 ${i < booking.rating ? "fill-amber-500 text-amber-500" : "text-slate-200"}"></i>`).join("")}
            </div>
            <span class="text-sm text-slate-500">You rated this service</span>
          </div>
        ` : ""}
        ${(booking.status === "cancelled" || booking.status === "rejected") ? `
          <a href="booking.html" class="btn-primary w-full py-3 text-sm block text-center">Book Again</a>
        ` : ""}
      </div>
    `;
    UI.icons();
  }

  function openCancelModal() { showModal("cancel-modal"); }
  function closeCancelModal() { hideModal("cancel-modal"); }
  function confirmCancel() {
    bookings = bookings.map(b => b.id === id ? { ...b, status: "cancelled" } : b);
    Store.setBookings(bookings);
    closeCancelModal();
    UI.toast("Booking cancelled", "success");
    location.reload();
  }

  let selectedStars = 0;
  function openRatingModal() {
    renderStars();
    showModal("rating-modal");
  }
  function renderStars() {
    document.getElementById("star-picker").innerHTML = Array.from({length: 5}, (_, i) => `
      <button onclick="selectStar(${i + 1})"><i data-lucide="star" class="w-8 h-8 ${i < selectedStars ? "fill-amber-500 text-amber-500" : "text-slate-200"}"></i></button>
    `).join("");
    UI.icons();
  }
  function selectStar(n) { selectedStars = n; renderStars(); }
  function submitRating() {
    if (selectedStars === 0) { UI.toast("Please select a rating", "error"); return; }
    bookings = bookings.map(b => b.id === id ? { ...b, rating: selectedStars } : b);
    Store.setBookings(bookings);
    hideModal("rating-modal");
    UI.toast("Thanks for your feedback!", "success");
    location.reload();
  }

  function showModal(id) {
    const m = document.getElementById(id);
    m.classList.remove("hidden"); m.classList.add("flex");
  }
  function hideModal(id) {
    const m = document.getElementById(id);
    m.classList.add("hidden"); m.classList.remove("flex");
  }

  render();
</script>
</body>
</html>
