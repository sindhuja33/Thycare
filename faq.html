<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAQ — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div class="flex">
  <aside id="sidebar"></aside>

  <div class="desktop-main">
    <header class="hidden lg:flex items-center px-8 py-5 glass border-b border-slate-100 sticky top-0 z-30">
      <h1 class="text-xl font-extrabold text-slate-900">Frequently Asked Questions</h1>
    </header>

    <main class="page-container content-scroll max-w-2xl">
      <header class="lg:hidden sticky top-0 z-30 glass px-4 py-4 border-b border-slate-100 flex items-center gap-3">
        <a href="home.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center">
          <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
        </a>
        <h1 class="font-bold text-slate-900">FAQ</h1>
      </header>

      <div class="px-4 lg:px-8 py-6">
        <div id="faq-list" class="space-y-2.5"></div>

        <a href="support.html" class="card p-4 flex items-center justify-between mt-6 hover-lift press-scale brand-gradient-soft border-blue-100">
          <span class="flex items-center gap-3 text-sm font-semibold text-slate-700"><i data-lucide="message-circle-question" class="w-4 h-4 text-blue-600"></i>Still have questions? Contact support</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
      </div>
    </main>
  </div>
</div>

<nav id="bottom-nav"></nav>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("support");

  document.getElementById("faq-list").innerHTML = MOCK.faqs.map((f, i) => `
    <div class="card overflow-hidden animate-fade-in-up">
      <button onclick="toggleFaq(${i})" class="w-full flex items-center justify-between p-4 text-left">
        <span class="text-sm font-semibold text-slate-800 pr-3">${f.q}</span>
        <i data-lucide="chevron-down" id="faq-icon-${i}" class="w-4 h-4 text-slate-400 shrink-0 transition-transform"></i>
      </button>
      <div id="faq-body-${i}" class="hidden px-4 pb-4">
        <p class="text-sm text-slate-500 leading-relaxed">${f.a}</p>
      </div>
    </div>
  `).join("");
  UI.icons();

  function toggleFaq(i) {
    const body = document.getElementById("faq-body-" + i);
    const icon = document.getElementById("faq-icon-" + i);
    const isOpen = !body.classList.contains("hidden");
    body.classList.toggle("hidden");
    icon.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
  }
</script>
</body>
</html>
