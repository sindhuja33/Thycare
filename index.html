<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareConnect — Doorstep Home Healthcare</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen brand-gradient overflow-hidden relative">

  <!-- decorative blobs -->
  <div class="absolute -top-24 -left-24 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-16 w-96 h-96 bg-white/10 rounded-full blur-3xl"></div>

  <div class="min-h-screen flex flex-col items-center justify-center px-6 relative z-10">
    <div class="flex flex-col items-center animate-scale-in">
      <div class="w-24 h-24 rounded-3xl bg-white/95 flex items-center justify-center shadow-2xl animate-float">
        <i data-lucide="heart-pulse" class="w-12 h-12 text-blue-600"></i>
      </div>
      <h1 class="text-white font-extrabold text-3xl mt-6 tracking-tight">CareConnect</h1>
      <p class="text-white/85 text-sm mt-2 font-medium">Compassionate care, at your doorstep</p>
    </div>

    <div class="mt-14 flex flex-col items-center gap-3 animate-fade-in-up stagger-3">
      <span class="spinner w-6 h-6"></span>
      <p class="text-white/70 text-xs font-medium tracking-wide" id="splash-status">Loading your experience…</p>
    </div>
  </div>

  <div class="absolute bottom-8 left-0 right-0 text-center animate-fade-in stagger-4">
    <p class="text-white/60 text-xs">Home Attendance • Elder Care • Baby Care • Nursing</p>
  </div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  Store.init();
  lucide.createIcons();

  setTimeout(() => {
    document.getElementById("splash-status").textContent = "Almost there…";
  }, 900);

  setTimeout(() => {
    if (Store.isAuthed()) {
      window.location.href = "home.html";
    } else {
      window.location.href = "login.html";
    }
  }, 1800);
</script>
</body>
</html>
