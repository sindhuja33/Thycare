<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patient Details — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div class="flex">
  <aside id="sidebar"></aside>

  <div class="desktop-main">
    <header class="hidden lg:flex items-center gap-3 px-8 py-5 glass border-b border-slate-100 sticky top-0 z-30">
      <a href="patients.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center hover:bg-slate-50">
        <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
      </a>
      <h1 class="text-xl font-extrabold text-slate-900">Patient Details</h1>
    </header>

    <main class="page-container content-scroll">
      <header class="lg:hidden sticky top-0 z-30 glass px-4 py-4 border-b border-slate-100 flex items-center gap-3">
        <a href="patients.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center">
          <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
        </a>
        <h1 class="font-bold text-slate-900">Patient Details</h1>
      </header>

      <div id="content" class="px-4 lg:px-8 py-6 max-w-2xl"></div>
    </main>
  </div>
</div>

<nav id="bottom-nav"></nav>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("patients");

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const patient = Store.getPatients().find(p => p.id === id);
  const content = document.getElementById("content");

  if (!patient) {
    content.innerHTML = `
      <div class="card p-10 text-center">
        <i data-lucide="user-x" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i>
        <p class="font-semibold text-slate-700">Patient not found</p>
        <a href="patients.html" class="btn-primary px-5 py-2.5 text-sm mt-4 inline-block">Back to Patients</a>
      </div>`;
  } else {
    const conditionBadge = c => c.toLowerCase() === "healthy" ? "badge-green" : "badge-blue";
    const patientBookings = Store.getBookings().filter(b => b.patient === patient.name);

    content.innerHTML = `
      <div class="card p-6 animate-fade-in-up">
        <div class="flex items-center gap-4">
          <img src="${patient.photo}" class="w-20 h-20 rounded-2xl object-cover" />
          <div class="min-w-0">
            <h2 class="font-extrabold text-xl text-slate-900 truncate">${patient.name}</h2>
            <p class="text-sm text-slate-500 mt-0.5">${patient.relationship} • ${patient.age} ${typeof patient.age === "number" ? "years" : ""} • ${patient.gender}</p>
            <div class="flex flex-wrap gap-1.5 mt-2.5">
              ${patient.conditions.map(c => `<span class="badge ${conditionBadge(c)}">${c}</span>`).join("")}
            </div>
          </div>
        </div>
        <div class="flex gap-3 mt-5">
          <a href="booking.html?patient=${patient.id}" class="btn-primary flex-1 py-2.5 text-sm text-center">Book Service</a>
          <a href="patients.html" class="btn-secondary flex-1 py-2.5 text-sm text-center">Edit Profile</a>
        </div>
      </div>

      <div class="card p-5 mt-5 animate-fade-in-up stagger-1">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-slate-900 text-sm">Medical Reports</h3>
          <button onclick="UI.toast('Report upload simulated','success')" class="text-xs text-blue-600 font-semibold flex items-center gap-1">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload
          </button>
        </div>
        ${patient.reports.length === 0 ? `
          <div class="text-center py-6">
            <i data-lucide="file-x" class="w-8 h-8 text-slate-300 mx-auto mb-2"></i>
            <p class="text-sm text-slate-500">No reports uploaded yet</p>
          </div>
        ` : patient.reports.map(r => `
          <div class="flex items-center justify-between py-2.5 border-b border-slate-50 last:border-0">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-9 h-9 rounded-lg bg-red-50 flex items-center justify-center shrink-0">
                <i data-lucide="file-text" class="w-4 h-4 text-red-500"></i>
              </div>
              <div class="min-w-0">
                <p class="text-sm font-medium text-slate-700 truncate">${r.name}</p>
                <p class="text-xs text-slate-400">${r.size} • ${UI.formatDate(r.date)}</p>
              </div>
            </div>
            <i data-lucide="download" class="w-4 h-4 text-slate-400 shrink-0"></i>
          </div>
        `).join("")}
      </div>

      <div class="card p-5 mt-5 animate-fade-in-up stagger-2">
        <h3 class="font-bold text-slate-900 text-sm mb-3">Booking History</h3>
        ${patientBookings.length === 0 ? `
          <p class="text-sm text-slate-500 text-center py-4">No bookings for this patient yet</p>
        ` : patientBookings.map(b => `
          <a href="booking-details.html?id=${b.id}" class="flex items-center justify-between py-2.5 border-b border-slate-50 last:border-0">
            <div>
              <p class="text-sm font-medium text-slate-700">${b.service}</p>
              <p class="text-xs text-slate-400">${UI.formatDate(b.date)}</p>
            </div>
            ${UI.statusBadge(b.status)}
          </a>
        `).join("")}
      </div>
    `;
  }

  UI.icons();
</script>
</body>
</html>
