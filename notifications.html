<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div class="flex">
  <aside id="sidebar"></aside>

  <div class="desktop-main">
    <header class="hidden lg:flex items-center justify-between px-8 py-5 glass border-b border-slate-100 sticky top-0 z-30">
      <h1 class="text-xl font-extrabold text-slate-900">Notifications</h1>
      <button onclick="markAllRead()" class="text-sm text-blue-600 font-semibold">Mark all as read</button>
    </header>

    <main class="page-container content-scroll max-w-2xl">
      <header class="lg:hidden sticky top-0 z-30 glass px-4 py-4 border-b border-slate-100 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="home.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center">
            <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
          </a>
          <h1 class="font-bold text-slate-900">Notifications</h1>
        </div>
        <button onclick="markAllRead()" class="text-xs text-blue-600 font-semibold">Mark all read</button>
      </header>

      <div class="px-4 lg:px-8 py-5">
        <div id="notif-list" class="space-y-2"></div>
      </div>
    </main>
  </div>
</div>

<nav id="bottom-nav"></nav>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("notifications");

  const typeIcon = { success: "check-circle-2", info: "info", error: "alert-circle" };
  const typeColor = { success: "bg-green-50 text-green-600", info: "bg-blue-50 text-blue-600", error: "bg-red-50 text-red-600" };

  function render() {
    const notifs = Store.getNotifications();
    document.getElementById("notif-list").innerHTML = notifs.map(n => `
      <div onclick="markRead(${n.id})" class="card p-3.5 flex items-start gap-3 press-scale cursor-pointer ${!n.read ? "border-l-4 !border-l-blue-500" : ""}">
        <div class="w-9 h-9 rounded-xl ${typeColor[n.type]} flex items-center justify-center shrink-0">
          <i data-lucide="${typeIcon[n.type]}" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <p class="text-sm font-semibold text-slate-800">${n.title}</p>
            ${!n.read ? `<span class="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>` : ""}
          </div>
          <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">${n.body}</p>
          <p class="text-[11px] text-slate-400 mt-1.5">${n.time}</p>
        </div>
      </div>
    `).join("");
    UI.icons();
  }

  function markRead(id) {
    const notifs = Store.getNotifications().map(n => n.id === id ? { ...n, read: true } : n);
    Store.setNotifications(notifs);
    render();
  }
  function markAllRead() {
    const notifs = Store.getNotifications().map(n => ({ ...n, read: true }));
    Store.setNotifications(notifs);
    UI.toast("All notifications marked as read", "success");
    render();
  }

  render();
</script>
</body>
</html>
