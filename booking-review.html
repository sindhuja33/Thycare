<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Booking — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div class="max-w-xl mx-auto min-h-screen">
  <header class="sticky top-0 z-30 glass px-4 py-4 border-b border-slate-100 flex items-center gap-3">
    <a href="booking.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center">
      <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
    </a>
    <h1 class="font-bold text-slate-900">Review Booking</h1>
  </header>

  <main id="content" class="px-4 py-6 pb-32"></main>

  <div class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto glass border-t border-slate-100 px-4 py-4">
    <button onclick="submitBooking()" id="submit-btn" class="btn-primary w-full py-3.5 flex items-center justify-center gap-2 press-scale">
      <span id="submit-label">Confirm & Submit</span>
    </button>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();

  const draft = Store.getDraftBooking();
  const content = document.getElementById("content");

  if (!draft.serviceId) {
    content.innerHTML = `
      <div class="card p-10 text-center">
        <i data-lucide="calendar-x" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i>
        <p class="font-semibold text-slate-700">No booking in progress</p>
        <p class="text-sm text-slate-500 mt-1">Start a new booking to see the review here.</p>
        <a href="booking.html" class="btn-primary px-5 py-2.5 text-sm mt-4 inline-block">Book a Service</a>
      </div>`;
    document.getElementById("submit-btn").classList.add("hidden");
  } else {
    const service = MOCK.services.find(s => s.id === draft.serviceId);
    const patient = Store.getPatients().find(p => p.id === draft.patientId);

    content.innerHTML = `
      <div class="card overflow-hidden animate-fade-in-up">
        <img src="${service?.image}" class="w-full h-36 object-cover" />
        <div class="p-4">
          <p class="font-bold text-slate-900">${service?.name}</p>
          <p class="text-xs text-slate-500 mt-1">${service?.description}</p>
        </div>
      </div>

      <div class="card p-4 mt-4 space-y-3">
        <div class="flex items-center gap-3">
          <img src="${patient?.photo}" class="w-11 h-11 rounded-xl object-cover" />
          <div>
            <p class="text-sm font-semibold text-slate-800">${patient?.name}</p>
            <p class="text-xs text-slate-500">${patient?.relationship}</p>
          </div>
        </div>
        <div class="divider"></div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4"></i>Date & Time</span>
          <span class="font-semibold text-slate-800">${draft.date ? UI.formatDate(draft.date) : "—"}, ${draft.time || "—"}</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="timer" class="w-4 h-4"></i>Duration</span>
          <span class="font-semibold text-slate-800">${draft.duration || "—"}</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-slate-500 flex items-center gap-1.5"><i data-lucide="map-pin" class="w-4 h-4"></i>Address</span>
          <span class="font-semibold text-slate-800">${draft.addressId || "—"}</span>
        </div>
      </div>

      <div class="card p-4 mt-4">
        <div class="flex items-center justify-between">
          <span class="font-bold text-slate-900">Total Payable</span>
          <span class="font-extrabold text-blue-600 text-lg">${UI.formatCurrency(draft.amount || 0)}</span>
        </div>
      </div>

      <a href="booking.html" class="flex items-center justify-center gap-1.5 text-sm text-blue-600 font-semibold mt-4">
        <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit Booking Details
      </a>
    `;
  }
  UI.icons();

  function submitBooking() {
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    document.getElementById("submit-label").innerHTML = `<span class="spinner w-4 h-4"></span> Submitting…`;
    UI.simulateApi({ success: true, delay: 1400 }).then(() => {
      window.location.href = "booking-confirmation.html?stage=pending";
    });
  }
</script>
</body>
</html>
