<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — CareConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div class="flex">
  <aside id="sidebar"></aside>

  <div class="desktop-main">
    <header class="hidden lg:flex items-center px-8 py-5 glass border-b border-slate-100 sticky top-0 z-30">
      <h1 class="text-xl font-extrabold text-slate-900">Profile</h1>
    </header>

    <main class="page-container content-scroll max-w-2xl">
      <header class="lg:hidden sticky top-0 z-30 glass px-4 py-4 border-b border-slate-100 flex items-center gap-3">
        <a href="home.html" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center">
          <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
        </a>
        <h1 class="font-bold text-slate-900">Profile</h1>
      </header>

      <div class="px-4 lg:px-8 py-6">

        <div class="card p-6 text-center brand-gradient-soft border-blue-100 animate-fade-in-up">
          <div class="relative inline-block">
            <img id="avatar" src="" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg mx-auto" />
            <button onclick="UI.toast('Photo upload simulated','success')" class="absolute bottom-0 right-0 w-8 h-8 rounded-full brand-gradient flex items-center justify-center border-2 border-white">
              <i data-lucide="camera" class="w-3.5 h-3.5 text-white"></i>
            </button>
          </div>
          <h2 class="font-extrabold text-xl text-slate-900 mt-3" id="name">—</h2>
          <p class="text-sm text-slate-500" id="email">—</p>
          <div class="flex items-center justify-center gap-2 mt-3">
            <span class="badge badge-blue"><i data-lucide="gem" class="w-3 h-3"></i> <span id="plan-badge">Premium</span></span>
            <span class="badge badge-green" id="kyc-badge"><i data-lucide="shield-check" class="w-3 h-3"></i> KYC Verified</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-5">
          <a href="patients.html" class="card p-4 hover-lift press-scale">
            <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center mb-2">
              <i data-lucide="users-round" class="w-5 h-5 text-blue-600"></i>
            </div>
            <p class="text-2xl font-extrabold text-slate-900" id="patients-count">0</p>
            <p class="text-xs text-slate-500">Patients</p>
          </a>
          <a href="bookings.html" class="card p-4 hover-lift press-scale">
            <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center mb-2">
              <i data-lucide="calendar-check" class="w-5 h-5 text-green-600"></i>
            </div>
            <p class="text-2xl font-extrabold text-slate-900" id="bookings-count">0</p>
            <p class="text-xs text-slate-500">Bookings</p>
          </a>
        </div>

        <div class="card p-1.5 mt-5 animate-fade-in-up stagger-1">
          <button onclick="openEditProfile()" class="w-full flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50">
            <span class="flex items-center gap-3 text-sm font-medium text-slate-700"><i data-lucide="user-round-pen" class="w-4 h-4 text-slate-500"></i>Edit Profile</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
          </button>
          <a href="subscriptions.html" class="w-full flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50">
            <span class="flex items-center gap-3 text-sm font-medium text-slate-700"><i data-lucide="gem" class="w-4 h-4 text-slate-500"></i>Manage Subscription</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
          </a>
          <a href="settings.html" class="w-full flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50">
            <span class="flex items-center gap-3 text-sm font-medium text-slate-700"><i data-lucide="settings" class="w-4 h-4 text-slate-500"></i>Settings</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
          </a>
          <a href="support.html" class="w-full flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50">
            <span class="flex items-center gap-3 text-sm font-medium text-slate-700"><i data-lucide="life-buoy" class="w-4 h-4 text-slate-500"></i>Help & Support</span>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
          </a>
        </div>

        <button onclick="UI.logout()" class="w-full flex items-center justify-center gap-2 p-3.5 mt-5 rounded-xl text-red-500 font-semibold text-sm border-2 border-red-100 press-scale">
          <i data-lucide="log-out" class="w-4 h-4"></i> Logout
        </button>
      </div>
    </main>
  </div>
</div>

<nav id="bottom-nav"></nav>

<!-- Edit modal -->
<div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center px-4">
  <div class="card p-6 max-w-md w-full animate-scale-in">
    <h3 class="font-extrabold text-lg text-slate-900 mb-4">Edit Profile</h3>
    <div class="space-y-3.5">
      <div>
        <label class="text-sm font-semibold text-slate-700 mb-1.5 block">Full Name</label>
        <input id="ef-name" class="input-field w-full" />
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-700 mb-1.5 block">Email</label>
        <input id="ef-email" class="input-field w-full" />
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-700 mb-1.5 block">Phone</label>
        <input id="ef-phone" class="input-field w-full" />
      </div>
      <div>
        <label class="text-sm font-semibold text-slate-700 mb-1.5 block">Address</label>
        <textarea id="ef-address" rows="2" class="input-field w-full resize-none"></textarea>
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button onclick="closeEditModal()" class="btn-secondary flex-1 py-2.5">Cancel</button>
      <button onclick="saveProfile()" id="save-profile-btn" class="btn-primary flex-1 py-2.5">Save Changes</button>
    </div>
  </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.requireAuth();
  UI.initShell("profile");

  function render() {
    const user = Store.getUser();
    document.getElementById("avatar").src = user.avatar;
    document.getElementById("name").textContent = user.name;
    document.getElementById("email").textContent = user.email;
    document.getElementById("plan-badge").textContent = MOCK.plans.find(p => p.id === Store.getPlan())?.name || "Basic";
    document.getElementById("kyc-badge").innerHTML = user.kycVerified
      ? `<i data-lucide="shield-check" class="w-3 h-3"></i> KYC Verified`
      : `<i data-lucide="shield-alert" class="w-3 h-3"></i> KYC Pending`;
    document.getElementById("kyc-badge").className = "badge " + (user.kycVerified ? "badge-green" : "badge-amber");
    document.getElementById("patients-count").textContent = Store.getPatients().length;
    document.getElementById("bookings-count").textContent = Store.getBookings().length;
    UI.icons();
  }

  function openEditProfile() {
    const user = Store.getUser();
    document.getElementById("ef-name").value = user.name;
    document.getElementById("ef-email").value = user.email;
    document.getElementById("ef-phone").value = user.phone;
    document.getElementById("ef-address").value = user.address;
    const m = document.getElementById("edit-modal");
    m.classList.remove("hidden"); m.classList.add("flex");
  }
  function closeEditModal() {
    const m = document.getElementById("edit-modal");
    m.classList.add("hidden"); m.classList.remove("flex");
  }
  function saveProfile() {
    const btn = document.getElementById("save-profile-btn");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner w-4 h-4"></span> Saving…`;
    UI.simulateApi({ success: true, delay: 900 }).then(() => {
      const user = Store.getUser();
      Store.setUser({
        ...user,
        name: document.getElementById("ef-name").value.trim() || user.name,
        email: document.getElementById("ef-email").value.trim() || user.email,
        phone: document.getElementById("ef-phone").value.trim() || user.phone,
        address: document.getElementById("ef-address").value.trim() || user.address
      });
      btn.disabled = false;
      btn.textContent = "Save Changes";
      closeEditModal();
      UI.toast("Profile updated successfully", "success");
      render();
    });
  }

  render();
</script>
</body>
</html>
